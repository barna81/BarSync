name: Build & Release Firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: arduino-cli installieren
        uses: arduino/setup-arduino-cli@v2

      - name: ESP32-Board-Core installieren
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Libraries installieren
        run: |
          arduino-cli lib install "MIDI Library"
          arduino-cli lib install "U8g2"

      - name: Aufgeloeste Versionen anzeigen (fuer spaeteres Pinnen)
        run: |
          echo "== Board-Core =="
          arduino-cli core list
          echo "== Libraries =="
          arduino-cli lib list

      - name: Sketch-Ordner fuer arduino-cli vorbereiten
        run: |
          mkdir -p /tmp/sketch/barsync
          cp firmware/barsync.ino /tmp/sketch/barsync/barsync.ino

      - name: Firmware kompilieren
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32doit-devkit-v1 \
            --export-binaries \
            --build-path firmware/build \
            --build-property "build.extra_flags=-DBARSYNC_BUILD_TAG=\"${GITHUB_REF_NAME}\"" \
            /tmp/sketch/barsync

      - name: Build-Ausgabe anzeigen
        run: ls -la firmware/build

      - name: Einzelbinary zusammenfuehren (merge_bin)
        run: |
          pip install --quiet esptool
          BD=firmware/build
          if [ -f "$BD"/barsync.ino.merged.bin ]; then
            cp "$BD"/barsync.ino.merged.bin barsync-merged.bin
          else
            BOOTAPP0=$(find "$HOME"/.arduino15 -name boot_app0.bin | head -1)
            python3 -m esptool --chip esp32 merge_bin -o barsync-merged.bin \
              --flash_mode dio --flash_freq 40m --flash_size 4MB \
              0x1000  "$BD"/barsync.ino.bootloader.bin \
              0x8000  "$BD"/barsync.ino.partitions.bin \
              0xe000  "$BOOTAPP0" \
              0x10000 "$BD"/barsync.ino.bin
          fi
          ls -la barsync-merged.bin

      - name: An GitHub Release anhaengen
        uses: softprops/action-gh-release@v2
        with:
          files: barsync-merged.bin
          fail_on_unmatched_files: true

      - name: Same-Origin-Kopie fuer die Flash-Seite aktualisieren
        run: |
          git fetch origin main:main --force
          git checkout main
          mkdir -p docs/flash/firmware
          cp barsync-merged.bin docs/flash/firmware/barsync-merged.bin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/flash/firmware/barsync-merged.bin
          git commit -m "Update flashable firmware binary (${GITHUB_REF_NAME})" || echo "Keine Aenderung"
          git push origin main
